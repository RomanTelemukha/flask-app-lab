{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card p-4 shadow-sm border-0 mt-4">
            <h2 class="fw-bold mb-3">Welcome, {{ current_user.username }}!</h2>
            <p class="text-muted mb-2">You have successfully logged in to your profile.</p>
            <p class="mb-4"><strong>Email:</strong> {{ current_user.email }}</p>
            <div>
                <a href="{{ url_for('users.logout') }}" class="btn btn-danger">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
