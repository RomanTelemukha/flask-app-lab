{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="card p-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h2 class="fw-bold mb-0">{{ post.title }}</h2>
                <span class="badge bg-secondary">{{ post.category }}</span>
            </div>
            <p class="text-muted small mb-3">
                Автор: <strong>{{ post.author }}</strong> | Опубліковано: {{ post.posted.strftime('%Y-%m-%d %H:%M') if post.posted else '' }}
            </p>
            <div class="mb-4">
                <p class="fs-5 text-secondary" style="white-space: pre-line;">{{ post.content }}</p>
            </div>
            <div class="d-flex gap-2">
                <a href="{{ url_for('posts.post_list') }}" class="btn btn-secondary">Назад</a>
                <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning">Edit</a>
                <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Delete</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
