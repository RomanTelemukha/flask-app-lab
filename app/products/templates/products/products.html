{% extends "base.html" %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<div class="container">
    <h2 class="mb-4 fw-bold">Каталог товарів</h2>
    <div class="row g-4">
        {% for product in products %}
        <div class="col-md-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ product.name }}</h5>
                    <p class="card-text text-muted flex-grow-1">{{ product.content }}</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fs-5 fw-bold text-primary">${{ product.price }}</span>
                        <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline-primary">Детальніше</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
